# Two runs a week.
#
#   Wednesday  open the new week: grade last week from final scores, then load
#              this week's games. Runs before any kickoff, so every game has a
#              real line and Thursday/Friday games are still pickable.
#
#   Saturday   re-price games that have not kicked off yet. It will NOT move a
#              line on a game someone has already picked, because that would
#              change what their pick meant.
#
# No secrets: GITHUB_TOKEN is issued to the workflow automatically, and the
# Supabase values below are the public ones already shipped in config.js.

name: Update slate

on:
  schedule:
    - cron: "0 12 * * 3"    # Wednesday 12:00 UTC — 8am ET (7am after DST ends)
    - cron: "0 12 * * 6"    # Saturday  12:00 UTC — 8am ET
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        options: [probe, open-week, refresh]
        default: probe
      week:
        description: "Force a week number (open-week only; blank = ESPN's)"
        type: string
        default: ""
      force_reprice:
        description: "Refresh: move lines even on games already picked"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: slate
  cancel-in-progress: false

env:
  SUPABASE_URL: "https://yjnagojqhlyfdpjhiwma.supabase.co"
  SUPABASE_KEY: "sb_publishable_WvjzTzgDnYkhmcjV3aC9Pg_Jvc-_UMg"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Wednesday's cron opens the week; Saturday's re-prices. A manual run
      # uses whatever mode was chosen.
      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 12 * * 3" ]; then
              echo "mode=open-week" >> "$GITHUB_OUTPUT"
            else
              echo "mode=refresh" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          fi
          echo "Mode: $(cat "$GITHUB_OUTPUT" | tail -1)"

      - name: Probe
        if: steps.mode.outputs.mode == 'probe'
        run: node scripts/build-slate.mjs --probe

      - name: Open the new week
        if: steps.mode.outputs.mode == 'open-week'
        run: |
          if [ -n "${{ inputs.week }}" ]; then
            node scripts/build-slate.mjs --week "${{ inputs.week }}"
          else
            node scripts/build-slate.mjs
          fi

      - name: Refresh lines
        if: steps.mode.outputs.mode == 'refresh'
        run: |
          if [ "${{ inputs.force_reprice }}" = "true" ]; then
            node scripts/build-slate.mjs --refresh --force-reprice
          else
            node scripts/build-slate.mjs --refresh
          fi

      - name: Sanity-check the result
        if: steps.mode.outputs.mode != 'probe'
        run: |
          node -e '
            const s = JSON.parse(require("fs").readFileSync("slate.json","utf8"));
            const w = s.weeks[String(s.currentWeek)];
            if (!w || !Array.isArray(w.games) || !w.games.length) {
              throw new Error("current week has no games");
            }
            for (const g of w.games) {
              for (const k of ["id","away","home","kickoff","spread","total"]) {
                if (g[k] === undefined || g[k] === null) {
                  throw new Error(`game ${g.id} is missing ${k}`);
                }
              }
              if (Number.isNaN(Date.parse(g.kickoff))) {
                throw new Error(`game ${g.id} has an unparseable kickoff`);
              }
            }
            console.log(`slate.json OK — week ${s.currentWeek}, ${w.games.length} games`);
          '

      - name: Commit if anything changed
        if: steps.mode.outputs.mode != 'probe'
        run: |
          if git diff --quiet -- slate.json; then
            echo "slate.json unchanged — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add slate.json
          git commit -m "${{ steps.mode.outputs.mode }}: slate week $(node -p "require('./slate.json').currentWeek")"
          git push
