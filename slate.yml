# Rebuilds slate.json every Saturday morning from ESPN's public feed:
# grades the week that just finished, then loads the new week's games.
#
# No token or secret is needed — GITHUB_TOKEN is issued automatically to the
# workflow and can write to this repo only.

name: Update slate

# The weekly schedule is DELIBERATELY DISABLED until a probe run has confirmed
# how the live ESPN feed actually numbers its weeks. Reads of that feed have
# disagreed with each other (week 2 vs week 3 for the same query), and if the
# week key it returns collides with a week already stored in slate.json, an
# automatic run would overwrite a graded week and orphan everyone's picks.
#
# To arm it once the numbering is confirmed, uncomment the two schedule lines.
on:
  # schedule:
  #   - cron: "0 12 * * 6"   # Saturdays 12:00 UTC = 8am ET (7am once DST ends)
  workflow_dispatch:         # manual "Run workflow" button only, for now
    inputs:
      probe:
        description: "Inspect the ESPN feed and write nothing"
        type: boolean
        default: false
      week:
        description: "Force a week number (leave blank for ESPN's)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: slate
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Probe the feed
        if: inputs.probe
        run: node scripts/build-slate.mjs --probe

      - name: Rebuild slate.json
        if: ${{ !inputs.probe }}
        run: |
          if [ -n "${{ inputs.week }}" ]; then
            node scripts/build-slate.mjs --week "${{ inputs.week }}"
          else
            node scripts/build-slate.mjs
          fi

      - name: Sanity-check the result
        if: ${{ !inputs.probe }}
        run: |
          node -e '
            const s = JSON.parse(require("fs").readFileSync("slate.json","utf8"));
            const w = s.weeks[String(s.currentWeek)];
            if (!w || !Array.isArray(w.games) || !w.games.length) {
              throw new Error("current week has no games");
            }
            for (const g of w.games) {
              for (const k of ["id","away","home","kickoff","spread","total"]) {
                if (g[k] === undefined || g[k] === null) {
                  throw new Error(`game ${g.id} is missing ${k}`);
                }
              }
              if (Number.isNaN(Date.parse(g.kickoff))) {
                throw new Error(`game ${g.id} has an unparseable kickoff`);
              }
            }
            console.log(`slate.json OK — week ${s.currentWeek}, ${w.games.length} games`);
          '

      - name: Commit if anything changed
        if: ${{ !inputs.probe }}
        run: |
          if git diff --quiet -- slate.json; then
            echo "slate.json unchanged — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add slate.json
          git commit -m "Update slate for week $(node -p "require('./slate.json').currentWeek")"
          git push
